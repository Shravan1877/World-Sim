# The six countries (CLAUDE.md §4.1, §4.3). Order here is the fixed country index order.
# Starting values are calibrated in Phase 4. Values not listed for a country fall back to
# the defaults in world.yaml (e.g. consumption shares, subsidy efficiency).
# Sector order for every list-like block: FOOD, ENERGY, GOODS, TECH, SERVICES.

countries:
  - name: DORNE
    character: Energy exporter, one giant energy monopoly
    government: Autocracy
    weak_spot: One-industry economy; energy shocks hit hard; energy monopoly (n=1)
    labor_force: 90                    # millions of workers
    productivity: {FOOD: 0.7800, ENERGY: 3.2500, GOODS: 0.7800, TECH: 0.5200, SERVICES: 1.0400}  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.1551, ENERGY: 0.1690, GOODS: 0.1763, TECH: 0.1435, SERVICES: 0.3561}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 1, GOODS: 4, TECH: 4, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.3
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 70
    initial_trust_received: 0.7        # how much every other country trusts DORNE at start
    food_floor: 0.02432                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [set_energy_export_quota, set_energy_export_levy]
    params: {}

  - name: BRONTIA
    character: Factory giant, biggest population
    government: Technocracy
    weak_spot: Needs imported energy for factories; low wages
    labor_force: 200
    productivity: {FOOD: 1.1700, ENERGY: 0.2800, GOODS: 1.4000, TECH: 0.7040, SERVICES: 0.6604}  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.2693, ENERGY: 0.1223, GOODS: 0.1750, TECH: 0.1469, SERVICES: 0.2865}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 3, TECH: 4, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.5
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 70
    initial_trust_received: 0.7
    food_floor: 0.01810                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [subsidize_industry]
    params:
      subsidy_efficiency: 1.0          # eta (others 0.5)

  - name: CERES
    character: Farmland, the food exporter
    government: Democracy
    weak_spot: Small industry; weak treasury; high debt
    labor_force: 120
    productivity: {FOOD: 1.5400, ENERGY: 0.6500, GOODS: 0.5080, TECH: 0.5200, SERVICES: 0.7527}  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.1540, ENERGY: 0.0910, GOODS: 0.2904, TECH: 0.1394, SERVICES: 0.3252}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 4, TECH: 4, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.8
    treasury_to_quarterly_gdp: 0.05
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 65
    initial_trust_received: 0.7
    food_floor: 0.02243                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [set_food_export_ban]
    params:
      leader_fall_prob: 0.8            # fast turnover: "election loss"
      leader_fall_label: election loss

  - name: FALKEN
    character: Strict state, strong military
    government: Military state
    weak_spot: Others trust it less (starting trust 0.5); lower productivity
    labor_force: 140
    productivity: {FOOD: 0.7667, ENERGY: 1.1700, GOODS: 1.4300, TECH: 0.7800, SERVICES: 0.6090}  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.2669, ENERGY: 0.1042, GOODS: 0.1750, TECH: 0.1182, SERVICES: 0.3357}  # D41 calibrated
    n_firms: {FOOD: 2, ENERGY: 2, GOODS: 2, TECH: 2, SERVICES: 2}
    tax_rate: 0.30
    debt_to_annual_gdp: 0.9
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.08, military: 0.08, subsidy: 0.02}
    stability: 60
    initial_trust_received: 0.5
    food_floor: 0.01792                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [nationalize, renounce_treaty]
    params:
      military_efficiency: 1.5
      renounce_stability_cost: 5       # renounce_treaty: no trust penalty, -5 stability
      leader_fall_label: coup

  - name: AURELIA
    character: Rich finance and services hub
    government: Oligarchic republic
    weak_spot: Imports almost all food and energy; small population
    labor_force: 60
    productivity: {FOOD: 0.3500, ENERGY: 0.2506, GOODS: 1.0143, TECH: 0.9100, SERVICES: 1.9142}  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.1717, ENERGY: 0.0937, GOODS: 0.1721, TECH: 0.1342, SERVICES: 0.4283}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 4, TECH: 4, SERVICES: 4}
    tax_rate: 0.20
    debt_to_annual_gdp: 0.6
    treasury_to_quarterly_gdp: 2.0
    spending: {welfare: 0.10, military: 0.02, subsidy: 0.01}
    stability: 70
    initial_trust_received: 0.7
    food_floor: 0.00903                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [set_policy_rate]
    params:
      sanction_self_cost: 0.15         # "cheap sanctions": 30% of the normal 0.5
      loan_unlimited: true             # may lend any amount in loan treaties

  - name: EVERMERE
    character: Open tech and startup economy
    government: Corporate democracy
    weak_spot: Small population; imports food and energy; dominant tech firm (n=1) at start
    labor_force: 70
    productivity: {FOOD: 0.3500, ENERGY: 0.3584, GOODS: 0.7000, TECH: 1.6800, SERVICES: 1.8200}  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.2588, ENERGY: 0.1529, GOODS: 0.1750, TECH: 0.0840, SERVICES: 0.3293}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 4, TECH: 1, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.7
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 70
    initial_trust_received: 0.7
    food_floor: 0.01361                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: []                # its powers are parameters + the random move slot
    params:
      antitrust_strength: 0.30         # 2x the default 0.15
      breakup_omega: 0.8               # others 0.9
      entry_mult: 2.0                  # startup entry multiplier

shared_actions:
  - set_tax
  - set_spending
  - set_tariff
  - set_sanction
  - propose_treaty
  - accept_treaty
  - reject_treaty
  - antitrust
  - set_subsidy_target
  - wait
