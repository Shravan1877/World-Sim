# The six countries (CLAUDE.md §4.1, §4.3). Order here is the fixed country index order.
# Starting values are calibrated in Phase 4. Values not listed for a country fall back to
# the defaults in world.yaml (e.g. consumption shares, subsidy efficiency).
# Sector order for every list-like block: FOOD, ENERGY, GOODS, TECH, SERVICES.

countries:
  - name: DORNE
    character: Energy exporter, one giant energy monopoly
    government: Autocracy
    weak_spot: One-industry economy; energy shocks hit hard; energy monopoly (n=1)
    labor_force: 90                    # millions of workers
    productivity: {FOOD: 0.59970, ENERGY: 2.80690, GOODS: 0.78000, TECH: 0.32680, SERVICES: 1.04000}  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.23810, ENERGY: 0.13940, GOODS: 0.27020, TECH: 0.12630, SERVICES: 0.22600}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 1, GOODS: 4, TECH: 4, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.3
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 70
    initial_trust_received: 0.7        # how much every other country trusts DORNE at start
    food_floor: 0.03070                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [set_energy_export_quota, set_energy_export_levy]
    params: {}

  - name: BRONTIA
    character: Factory giant, biggest population
    government: Technocracy
    weak_spot: Needs imported energy for factories; low wages
    labor_force: 200
    productivity: {FOOD: 0.72280, ENERGY: 0.42430, GOODS: 1.89060, TECH: 0.87400, SERVICES: 0.99580}  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.26370, ENERGY: 0.11340, GOODS: 0.23340, TECH: 0.08400, SERVICES: 0.30550}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 3, TECH: 4, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.5
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 70
    initial_trust_received: 0.7
    food_floor: 0.01271                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [subsidize_industry]
    params:
      subsidy_efficiency: 1.0          # eta (others 0.5)

  - name: CERES
    character: Farmland, the food exporter
    government: Democracy
    weak_spot: Small industry; weak treasury; high debt
    labor_force: 120
    productivity: {FOOD: 1.54910, ENERGY: 0.42240, GOODS: 0.70470, TECH: 0.32470, SERVICES: 0.71610}  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.21892, ENERGY: 0.13871, GOODS: 0.27984, TECH: 0.11751, SERVICES: 0.24502}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 4, TECH: 4, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.8
    treasury_to_quarterly_gdp: 0.05
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 65
    initial_trust_received: 0.7
    food_floor: 0.02533                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [set_food_export_ban]
    params:
      leader_fall_prob: 0.8            # fast turnover: "election loss"
      leader_fall_label: election loss

  - name: FALKEN
    character: Strict state, strong military
    government: Military state
    weak_spot: Others trust it less (starting trust 0.5); lower productivity
    labor_force: 140
    productivity: {FOOD: 0.80940, ENERGY: 1.01540, GOODS: 1.11140, TECH: 0.55340, SERVICES: 0.76040}  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.20860, ENERGY: 0.12290, GOODS: 0.26190, TECH: 0.15600, SERVICES: 0.25060}  # D41 calibrated
    n_firms: {FOOD: 2, ENERGY: 2, GOODS: 2, TECH: 2, SERVICES: 2}
    tax_rate: 0.30
    debt_to_annual_gdp: 0.9
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.08, military: 0.08, subsidy: 0.02}
    stability: 60
    initial_trust_received: 0.5
    food_floor: 0.01440                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [nationalize, renounce_treaty]
    params:
      military_efficiency: 1.5
      renounce_stability_cost: 5       # renounce_treaty: no trust penalty, -5 stability
      leader_fall_label: coup

  - name: AURELIA
    character: Rich finance and services hub
    government: Oligarchic republic
    weak_spot: Imports almost all food and energy; small population
    labor_force: 60
    productivity: {FOOD: 0.35000, ENERGY: 0.35690, GOODS: 1.17000, TECH: 1.58860, SERVICES: 1.96080}  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.23100, ENERGY: 0.10660, GOODS: 0.22460, TECH: 0.09920, SERVICES: 0.33860}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 4, TECH: 4, SERVICES: 4}
    tax_rate: 0.20
    debt_to_annual_gdp: 0.6
    treasury_to_quarterly_gdp: 2.0
    spending: {welfare: 0.10, military: 0.02, subsidy: 0.01}
    stability: 70
    initial_trust_received: 0.7
    food_floor: 0.02154                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: [set_policy_rate]
    params:
      sanction_self_cost: 0.15         # "cheap sanctions": 30% of the normal 0.5
      loan_unlimited: true             # may lend any amount in loan treaties

  - name: EVERMERE
    character: Open tech and startup economy
    government: Corporate democracy
    weak_spot: Small population; imports food and energy; dominant tech firm (n=1) at start
    labor_force: 70
    productivity: {FOOD: 0.37490, ENERGY: 0.42320, GOODS: 0.96960, TECH: 2.12070, SERVICES: 1.09280}  # D41 calibrated (docs/calibration.md)
    consumption_shares: {FOOD: 0.22948, ENERGY: 0.12399, GOODS: 0.21368, TECH: 0.11389, SERVICES: 0.31896}  # D41 calibrated
    n_firms: {FOOD: 4, ENERGY: 4, GOODS: 4, TECH: 1, SERVICES: 4}
    tax_rate: 0.25
    debt_to_annual_gdp: 0.7
    treasury_to_quarterly_gdp: 0.25
    spending: {welfare: 0.12, military: 0.03, subsidy: 0.02}
    stability: 70
    initial_trust_received: 0.7
    food_floor: 0.01485                    # D43: f_min_i (set by scripts/calibrate_balance.py)
    special_actions: []                # its powers are parameters + the random move slot
    params:
      antitrust_strength: 0.30         # 2x the default 0.15
      breakup_omega: 0.8               # others 0.9
      entry_mult: 2.0                  # startup entry multiplier

shared_actions:
  - set_tax
  - set_spending
  - set_tariff
  - set_sanction
  - propose_treaty
  - accept_treaty
  - reject_treaty
  - antitrust
  - set_subsidy_target
  - wait
