[project]
name = "worldsim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a real LLM API; skipped unless --live is passed"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# Engine code uses the math notation of CLAUDE.md (A, L, E, Q, D, P): allow uppercase args/variables.
ignore = ["N803", "N806"]
